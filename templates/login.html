{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход</h1>
<form method="post" class="box form">
<label for="email">E-mail</label><input id="email" name="email" type="email" required>
<label for="password">Пароль</label><input id="password" name="password" type="password" required>
<p><button class="btn" type="submit">Войти</button> <a href="{{ url_for('register') }}">Регистрация</a></p>
</form>
{% endblock %}
