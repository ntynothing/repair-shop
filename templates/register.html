{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" class="box form">
<label for="name">Имя</label><input id="name" name="name" value="{{ f.get('name','') }}" required minlength="2" maxlength="60">
<label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ f.get('email','') }}" required>
<label for="phone">Телефон</label><input id="phone" name="phone" value="{{ f.get('phone','') }}" required placeholder="+79001234567">
<label for="password">Пароль (от 6 символов)</label><input id="password" name="password" type="password" required minlength="6" maxlength="64">
<label for="password2">Повторите пароль</label><input id="password2" name="password2" type="password" required>
<p><button class="btn" type="submit">Зарегистрироваться</button></p>
</form>
{% endblock %}
